<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsentLens</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

        body {
            width: 320px;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: #0d0d12;
            color: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        .popup-container {
            padding: 24px;
            background: linear-gradient(180deg, rgba(124, 92, 255, 0.05) 0%, transparent 100%);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c5cff, #00ffd5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(124, 92, 255, 0.3);
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        #status-text {
            font-size: 13px;
            font-weight: 600;
            color: #00ffd5;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }

        .action-button {
            width: 100%;
            height: 44px;
            background: #7c5cff;
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(124, 92, 255, 0.2);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(124, 92, 255, 0.3);
            background: #8b6fff;
        }

        .footer {
            margin-top: 24px;
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
        }

        .version {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.05em;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(124, 92, 255, 0.1);
            color: #7c5cff;
            border: 1px solid rgba(124, 92, 255, 0.2);
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="popup-container">
        <div class="header">
            <div class="logo-group">
                <div class="logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <h1>ConsentLens</h1>
            </div>
            <div class="badge">SECURE</div>
        </div>

        <div class="status-card">
            <div id="status-text">Ready to Scan</div>
            <div class="description">Click the button below to analyze this page's privacy policy.</div>
        </div>

        <button id="scan-now" class="action-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
            </svg>
            Analyze Page
        </button>
    </div>

    <div class="footer">
        <span class="version">V1.2.0</span>
        <div style="display: flex; align-items: center; gap: 6px;">
            <div style="width: 6px; height: 6px; border-radius: 50%; background: #00ffd5; box-shadow: 0 0 8px #00ffd5;">
            </div>
            <span style="font-size: 10px; font-weight: 700; color: #00ffd5; text-transform: uppercase;">AI Active</span>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
